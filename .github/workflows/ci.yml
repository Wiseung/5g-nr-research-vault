name: Vault CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository publishing rules
        run: |
          if [ -f README.md ] || [ -f .gitignore ]; then
            test -f README.md
            test -f .gitignore
            grep -Fxq '/NR解码代码/' .gitignore
          fi
          if [ -n "$(git ls-files -- 'NR解码代码/**')" ]; then
            echo "NR解码代码 must not be committed to this repository."
            exit 1
          fi
